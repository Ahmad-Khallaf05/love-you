<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى حبيبتي</title>
    <!-- استدعاء خطوط عربية جميلة من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            position: relative;
            transition: background 1s ease;
        }

        /* صندوق المحتوى الزجاجي */
        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.25);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 117, 140, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            color: #fff;
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        p {
            color: #fff;
            font-size: 1.4rem;
            line-height: 1.8;
            display: none; /* الرسالة مخفية في البداية */
            opacity: 0;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        /* تنسيق الزر */
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.3s, background-color 0.3s;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            animation: pulse 2s infinite; /* حركة النبض */
        }

        .btn:hover {
            background-color: #ff6b81;
            transform: scale(1.1);
        }

        /* حركة النبض للزر */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* حركة تطاير القلوب */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            z-index: 1;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) scale(1.5);
                opacity: 0;
            }
        }
        
        /* حركة ظهور الرسالة */
        .fade-in {
            display: block;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- القلوب المتحركة ستضاف هنا عبر الجافاسكربت -->

    <div class="container" id="mainContainer">
        <h1 id="titleText">إلى أجمل إنسانة في حياتي ❤️</h1>
        
        <button class="btn" id="revealBtn">عندي سر لكِ.. اضغطي هنا</button>
        
        <!-- يمكنك تعديل هذا النص كما تحب -->
        <p id="loveMessage">
            منذ أن دخلتي حياتي، وكل شيء أصبح أجمل وأكثر إشراقاً.<br>
            أنتِ لستِ فقط حبيبتي، بل أنتِ روحي، وابتسامتي، ونبض قلبي.<br><br>
            أحبكِ اليوم، وغداً، وإلى الأبد. 💖<br>
        </p>
    </div>

    <script>
        // دالة لإنشاء قلوب تتطاير في الخلفية
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            // اختيار عشوائي للقلوب
            const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '🌸'];
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            
            // خصائص عشوائية (المكان، الحجم، السرعة)
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            heart.style.animation = `floatUp ${Math.random() * 3 + 4}s linear infinite`;
            heart.style.opacity = Math.random() * 0.5 + 0.3; // شفافية عشوائية
            
            document.body.appendChild(heart);
            
            // حذف القلب بعد انتهاء حركته لتخفيف الضغط على المتصفح
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // إنشاء قلب جديد كل 300 جزء من الثانية
        setInterval(createHeart, 300);

        // التفاعل مع الزر
        const btn = document.getElementById('revealBtn');
        const message = document.getElementById('loveMessage');
        const title = document.getElementById('titleText');

        btn.addEventListener('click', () => {
            // إخفاء الزر
            btn.style.display = 'none';
            
            // إظهار الرسالة بحركة ناعمة
            message.classList.add('fade-in');
            
            // تغيير لون الخلفية ليكون أفتح وأكثر رومانسية
            document.body.style.background = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)';
            title.style.color = '#ff4757';
            message.style.color = '#d63031';
            
            // إطلاق الكثير من القلوب دفعة واحدة كاحتفال
            for(let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 50);
            }
        });
    </script>
</body>
</html>
